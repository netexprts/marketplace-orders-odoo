<style>
:root{
  --green:#1068C0; --green-d:#0B3E7A; --green-l:#E8F2FC;
  --brown:#0B2454; --brown-d:#071835; --brown-l:#EDF3FA;
  --cream:#F5F8FC; --cream-d:#EAF0F8;
  --ink:#16213A; --muted:#5B6B85;
  --noon-yellow:#FEEE00; --noon-ink:#222;
  --amazon-orange:#FF9900; --amazon-ink:#232F3E;
  --trendyol-orange:#F27A1A; --trendyol-d:#C25E0A;
  --ok:#2E9E44; --warn:#C97B2B; --err:#C0392B;
  --shadow:0 4px 20px rgba(11,36,84,0.08);
  --shadow-h:0 8px 30px rgba(11,36,84,0.15);
}
*{box-sizing:border-box}
.topnav{
  background:linear-gradient(90deg, var(--brown-d) 0%, var(--brown) 100%);
  color:#fff; width:100%;
  box-shadow:0 2px 12px rgba(11,36,84,0.18);
  position:relative; z-index:5;
}
.topnav-inner{
  max-width:1200px; margin:0 auto; padding:0 24px;
  display:flex; align-items:center; gap:28px; height:56px;
}
.topnav-brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.topnav-brand img{width:26px;height:26px;display:block}
.topnav-brand span{font-family:'Inter',sans-serif;font-weight:800;font-size:15px;letter-spacing:0.3px;color:#fff}
.topnav-links{display:flex;align-items:center;gap:4px;flex:1}
.topnav-links span{
  font-size:13px;font-weight:600;color:rgba(255,255,255,0.72);
  padding:8px 14px;border-radius:8px;cursor:default;
  transition:all 0.2s; letter-spacing:0.2px;
}
.topnav-links span:hover{background:rgba(255,255,255,0.1);color:#fff}
.topnav-links span.on{color:#fff;background:rgba(255,255,255,0.14)}
.topnav-search{
  display:flex;align-items:center;gap:8px;flex-shrink:0;
  background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.16);
  border-radius:20px; padding:7px 14px; cursor:default;
  transition:all 0.2s; color:rgba(255,255,255,0.85);
}
.topnav-search:hover{background:rgba(255,255,255,0.16)}
.topnav-search svg{width:15px;height:15px;flex-shrink:0}
.topnav-search span{font-size:12.5px;color:rgba(255,255,255,0.65);white-space:nowrap}
@media(max-width:780px){ .topnav-links{display:none} .topnav-search span{display:none} }

html,body{margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,Segoe UI,Tahoma,Arial,sans-serif;
  background:var(--cream); color:var(--ink); min-height:100vh;
  background-image:
    radial-gradient(circle at 10% 5%, rgba(16,104,192,0.06) 0%, transparent 35%),
    radial-gradient(circle at 95% 90%, rgba(11,36,84,0.05) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(16,104,192,0.02) 0%, transparent 60%);
  position:relative;
}
.leaves-bg{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.06;overflow:hidden}
.leaves-bg svg{position:absolute}
.leaf-1{top:8%;left:3%;width:140px;transform:rotate(-25deg)}
.leaf-2{top:20%;right:5%;width:100px;transform:rotate(45deg)}
.leaf-3{bottom:15%;left:8%;width:120px;transform:rotate(120deg)}
.leaf-4{bottom:5%;right:10%;width:80px;transform:rotate(-60deg)}

.container{max-width:1200px;margin:0 auto;padding:32px 24px;position:relative;z-index:1}

/* HEADER */
.header{
  background:#fff; border-radius:28px; padding:36px 44px;
  margin-bottom:28px; box-shadow:var(--shadow);
  border:1px solid rgba(11,36,84,0.08);
  position:relative; overflow:hidden;
  display:flex; align-items:center; gap:32px; flex-wrap:wrap;
}
.header::before{
  content:'';position:absolute;top:-40%;right:-10%;width:280px;height:280px;
  background:radial-gradient(circle, var(--green-l) 0%, transparent 65%);
  z-index:0;border-radius:50%;
}
.header::after{
  content:'';position:absolute;bottom:-30%;left:-5%;width:240px;height:240px;
  background:radial-gradient(circle, var(--brown-l) 0%, transparent 65%);
  z-index:0;border-radius:50%;
}
.header > *{position:relative;z-index:1}
.brand-block{display:flex;align-items:center;gap:22px;flex-shrink:0}
.logo-plate{
  width:210px;height:112px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  position:relative;background:#fff;
  padding:10px 16px;
  box-shadow:0 8px 22px rgba(11,36,84,0.12), 0 2px 6px rgba(16,104,192,0.12);
  border:1px solid rgba(16,104,192,0.18);
  flex-shrink:0;
}
.logo-plate::before{
  content:'';position:absolute;inset:-6px;
  border-radius:22px;
  background:linear-gradient(135deg, var(--green-l) 0%, transparent 40%, transparent 60%, var(--brown-l) 100%);
  z-index:-1;opacity:0.6;
}
.logo-plate img{max-width:100%;max-height:100%;object-fit:contain;display:block}

.header-divider{
  width:1.5px;height:120px;
  background:linear-gradient(180deg, transparent 0%, var(--green) 30%, var(--brown) 70%, transparent 100%);
  align-self:center;flex-shrink:0;margin:0 4px;
}
.header-title{flex:1;min-width:240px}
.header-title h1{
  font-family:'Inter',sans-serif;font-size:36px;font-weight:900;
  margin:0;color:var(--brown-d);line-height:1.1;letter-spacing:-0.5px;
}
.header-title .accent{color:var(--green-d);font-family:'Playfair Display',serif;margin:0 6px}
.header-title .sub{
  margin-top:14px;color:var(--muted);font-size:15px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.divider-dot{width:5px;height:5px;border-radius:50%;background:var(--green);display:inline-block}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;background:var(--green);color:#fff;
  border-radius:20px;font-size:12px;font-weight:700;
  box-shadow:0 3px 8px rgba(16,104,192,0.35);
}
@media(max-width:780px){ .header-divider{display:none} }

/* TABS */
.tabs{
  display:flex; gap:0; margin-bottom:0;
  background:#fff; border-radius:20px 20px 0 0;
  padding:8px; box-shadow:var(--shadow);
  border:1px solid rgba(11,36,84,0.08);
  border-bottom:0;
  position:relative; z-index:2;
}
.tab{
  flex:1; padding:14px 20px; border-radius:14px;
  cursor:pointer; transition:all 0.25s;
  display:flex; align-items:center; justify-content:center; gap:14px;
  font-weight:700; font-size:15px; color:var(--muted);
  border:0; background:transparent; font-family:inherit;
  position:relative;
}
.tab:hover{background:var(--cream); color:var(--brown-d)}
.tab.active{
  background:linear-gradient(135deg, var(--green-l) 0%, var(--brown-l) 100%);
  color:var(--brown-d);
  box-shadow:inset 0 0 0 1.5px var(--green);
}
.tab.active.amzn{
  background:linear-gradient(135deg, #FFF4DC 0%, var(--brown-l) 100%);
  box-shadow:inset 0 0 0 1.5px var(--amazon-orange);
}
.tab.active.trendyol{
  background:linear-gradient(135deg, #FDEBDA 0%, var(--brown-l) 100%);
  box-shadow:inset 0 0 0 1.5px var(--trendyol-orange);
}

/* Platform brand boxes inside tabs */
.tab-brand{
  width:90px;height:38px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:all 0.2s;
}
.tab.noon-tab .tab-brand{background:var(--noon-yellow);box-shadow:0 2px 6px rgba(254,238,0,0.4)}
.tab.amzn .tab-brand{background:var(--amazon-ink);box-shadow:0 2px 6px rgba(35,47,62,0.3)}
.tab.trendyol .tab-brand{background:var(--trendyol-orange);box-shadow:0 2px 6px rgba(242,122,26,0.4)}
.tab-meta{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;gap:2px}
.tab-meta .name{font-size:14px;font-weight:800;letter-spacing:-0.2px}
.tab-meta .sub{font-size:11px;color:var(--muted);font-weight:600}
.tab.active .tab-meta .sub{color:var(--green-d)}
.tab.active.amzn .tab-meta .sub{color:#9B6800}
.tab.active.trendyol .tab-meta .sub{color:var(--trendyol-d)}

/* CARDS */
.card{
  background:#fff; border:1px solid rgba(11,36,84,0.08);
  border-radius:24px; padding:8px; margin-bottom:24px;
  box-shadow:var(--shadow); transition:all 0.3s; position:relative;
}
.card.connected{border-radius:0 0 24px 24px;border-top:0;margin-top:0}
.card:hover{box-shadow:var(--shadow-h)}
.card-inner{
  border:1px solid rgba(16,104,192,0.2);
  border-radius:18px; padding:28px 30px;
  position:relative;
  background:linear-gradient(180deg, #fff 0%, var(--cream) 100%);
}
.card-inner::before{
  content:'';position:absolute;top:0;left:24px;width:60px;height:3px;
  background:linear-gradient(90deg, var(--green), var(--brown));
  border-radius:0 0 4px 4px;
}
.card-inner.amzn::before{ background:linear-gradient(90deg, var(--amazon-orange), var(--brown)) }
.card-inner.amzn{border-color:rgba(255,153,0,0.3)}
.card-inner.trendyol::before{ background:linear-gradient(90deg, var(--trendyol-orange), var(--brown)) }
.card-inner.trendyol{border-color:rgba(242,122,26,0.3)}

.card-title{
  display:flex;align-items:center;gap:14px;
  font-size:20px;font-weight:800;color:var(--brown-d);
  margin:0 0 22px 0; padding-bottom:14px;
  border-bottom:1.5px dashed rgba(11,36,84,0.15);
}
.card-title-icon{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg, var(--green) 0%, var(--green-d) 100%);
  color:#fff; display:flex;align-items:center;justify-content:center;
  font-size:18px; box-shadow:0 4px 10px rgba(16,104,192,0.4);
}
.card-title-icon.amzn{
  background:linear-gradient(135deg, var(--amazon-orange) 0%, #B36A00 100%);
  box-shadow:0 4px 10px rgba(255,153,0,0.3);
}
.card-title-icon.trendyol{
  background:linear-gradient(135deg, var(--trendyol-orange) 0%, var(--trendyol-d) 100%);
  box-shadow:0 4px 10px rgba(242,122,26,0.3);
}

/* DROP ZONE */
.drop{
  border:2.5px dashed var(--green); border-radius:20px;
  padding:56px 24px; text-align:center; cursor:pointer;
  transition:all 0.3s;
  background:
    radial-gradient(circle at 20% 30%, rgba(16,104,192,0.1) 0%, transparent 35%),
    radial-gradient(circle at 80% 70%, rgba(11,36,84,0.06) 0%, transparent 40%),
    linear-gradient(135deg, var(--cream) 0%, #fff 100%);
  position:relative; overflow:hidden;
}
.drop.amzn{
  border-color:var(--amazon-orange);
  background:
    radial-gradient(circle at 20% 30%, rgba(255,153,0,0.08) 0%, transparent 35%),
    radial-gradient(circle at 80% 70%, rgba(11,36,84,0.06) 0%, transparent 40%),
    linear-gradient(135deg, var(--cream) 0%, #fff 100%);
}
.drop.trendyol{
  border-color:var(--trendyol-orange);
  background:
    radial-gradient(circle at 20% 30%, rgba(242,122,26,0.08) 0%, transparent 35%),
    radial-gradient(circle at 80% 70%, rgba(11,36,84,0.06) 0%, transparent 40%),
    linear-gradient(135deg, var(--cream) 0%, #fff 100%);
}
.drop::after{
  content:'';position:absolute;inset:8px;
  border:1px dashed rgba(16,104,192,0.3);
  border-radius:14px;pointer-events:none;
}
.drop.amzn::after{border-color:rgba(255,153,0,0.3)}
.drop.trendyol::after{border-color:rgba(242,122,26,0.3)}
.drop:hover,.drop.over{transform:translateY(-3px);box-shadow:0 10px 30px rgba(16,104,192,0.18)}
.drop.amzn:hover,.drop.amzn.over{box-shadow:0 10px 30px rgba(255,153,0,0.18)}
.drop.trendyol:hover,.drop.trendyol.over{box-shadow:0 10px 30px rgba(242,122,26,0.18)}
.drop > *{position:relative;z-index:1}
.drop h3{margin:18px 0 8px;font-size:22px;color:var(--brown-d);font-weight:800;letter-spacing:-0.2px}
.drop p{color:var(--muted);margin:4px 0;font-size:14px}
.drop input{display:none}
.drop-icon{
  width:90px;height:90px;border-radius:50%;
  background:linear-gradient(135deg, #fff 0%, var(--cream) 100%);
  border:2.5px solid var(--green);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:42px;color:var(--green-d);
  box-shadow:0 6px 18px rgba(16,104,192,0.25), inset 0 0 0 4px rgba(255,255,255,0.5);
  margin-bottom:6px; position:relative;
}
.drop.amzn .drop-icon{
  border-color:var(--amazon-orange); color:var(--amazon-orange);
  box-shadow:0 6px 18px rgba(255,153,0,0.25), inset 0 0 0 4px rgba(255,255,255,0.5);
}
.drop.trendyol .drop-icon{
  border-color:var(--trendyol-orange); color:var(--trendyol-orange);
  box-shadow:0 6px 18px rgba(242,122,26,0.25), inset 0 0 0 4px rgba(255,255,255,0.5);
}
.drop-icon::before{
  content:'';position:absolute;inset:-8px;
  border:1.5px dashed rgba(16,104,192,0.35);
  border-radius:50%; animation:rotate 30s linear infinite;
}
.drop.amzn .drop-icon::before{border-color:rgba(255,153,0,0.4)}
.drop.trendyol .drop-icon::before{border-color:rgba(242,122,26,0.4)}
.formats{display:inline-flex;gap:8px;margin-top:18px}
.format-pill{
  padding:5px 14px;background:#fff;border:1.5px solid var(--green);
  border-radius:20px;font-size:12px;color:var(--green-d);font-weight:700;
  box-shadow:0 2px 6px rgba(16,104,192,0.12);
}
.drop.amzn .format-pill{border-color:var(--amazon-orange);color:#9B6800}
.drop.trendyol .format-pill{border-color:var(--trendyol-orange);color:var(--trendyol-d)}

/* BUTTONS */
.btn{
  background:var(--green);color:white;border:0;
  padding:14px 32px;border-radius:12px;
  font-size:15px;font-weight:700;font-family:inherit;
  cursor:pointer;transition:all 0.2s;
  display:inline-flex;align-items:center;gap:10px;
  box-shadow:0 4px 12px rgba(16,104,192,0.35);
  letter-spacing:-0.2px;
}
.btn:hover{background:var(--green-d);transform:translateY(-2px);box-shadow:0 6px 18px rgba(16,104,192,0.5)}
.btn.amzn{background:var(--amazon-orange);box-shadow:0 4px 12px rgba(255,153,0,0.35)}
.btn.amzn:hover{background:#B36A00;box-shadow:0 6px 18px rgba(255,153,0,0.5)}
.btn.trendyol{background:var(--trendyol-orange);box-shadow:0 4px 12px rgba(242,122,26,0.35)}
.btn.trendyol:hover{background:var(--trendyol-d);box-shadow:0 6px 18px rgba(242,122,26,0.5)}
.btn-outline{background:#fff;color:var(--brown);border:1.5px solid var(--brown-l);box-shadow:none}
.btn-outline:hover{background:var(--brown-l);color:var(--brown-d)}

/* STATS GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:8px 0 4px}
.stat{
  background:linear-gradient(135deg, #fff, var(--cream));
  border:1px solid rgba(11,36,84,0.08);
  border-radius:14px; padding:18px 20px;
  position:relative;overflow:hidden; transition:transform 0.2s;
}
.stat:hover{transform:translateY(-3px)}
.stat::after{
  content:'';position:absolute;top:0;left:0;width:4px;height:100%;
  background:var(--green);
}
.stat .label{color:var(--muted);font-size:12px;margin-bottom:6px;font-weight:600;letter-spacing:0.1px}
.stat .val{font-size:28px;font-weight:900;color:var(--brown-d);font-family:'Playfair Display',serif}
.stat.ok::after{background:var(--ok)}
.stat.warn::after{background:var(--warn)}
.stat.warn .val{color:var(--warn)}
.stat.err::after{background:var(--err)}
.stat.err .val{color:var(--err)}
.stat.amzn::after{background:var(--amazon-orange)}
.stat.trendyol::after{background:var(--trendyol-orange)}

/* TABLE */
table{width:100%;border-collapse:collapse;margin-top:14px;border-radius:12px;overflow:hidden}
th,td{padding:12px 16px;text-align:left;font-size:14px}
th{background:var(--brown);color:#fff;font-weight:700;font-size:13px;letter-spacing:0.2px}
tr{border-bottom:1px solid var(--cream-d)}
tr:nth-child(even){background:var(--cream)}
tr:hover{background:var(--green-l)}

/* ALERTS */
.alert{
  border-radius:12px;padding:14px 18px;margin:14px 0;
  font-size:14px;display:flex;gap:12px;align-items:flex-start;
  border-left:4px solid;font-weight:600;
}
.alert-warn{background:#FFF8EC;border-color:var(--warn);color:#8C5814}
.alert-err{background:#FDECEA;border-color:var(--err);color:#8B2418}
.alert-ok{background:var(--green-l);border-color:var(--ok);color:var(--green-d)}

.hidden{display:none}
.actions{display:flex;gap:14px;justify-content:center;margin-top:24px;flex-wrap:wrap}

.spinner{
  display:inline-block;width:18px;height:18px;
  border:3px solid rgba(255,255,255,0.3);
  border-top-color:white;border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.rule{
  background:linear-gradient(135deg, var(--cream) 0%, #fff 100%);
  border:1px solid rgba(16,104,192,0.2);
  border-radius:14px; padding:16px 18px;
  display:flex;gap:14px;align-items:flex-start;
}
.rule.amzn{border-color:rgba(255,153,0,0.3)}
.rule.trendyol{border-color:rgba(242,122,26,0.3)}
.rule-num{
  width:34px;height:34px;flex-shrink:0;
  background:var(--green);color:#fff;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-family:'Playfair Display',serif;
}
.rule.amzn .rule-num{background:var(--amazon-orange)}
.rule.trendyol .rule-num{background:var(--trendyol-orange)}
.rule-body{flex:1}
.rule-title{font-weight:700;color:var(--brown-d);margin-bottom:4px;font-size:14px;letter-spacing:-0.1px}
.rule-desc{font-size:13px;color:var(--muted);line-height:1.5}
.rule-desc code{background:var(--green-l);color:var(--green-d);padding:1px 6px;border-radius:4px;font-size:12px;font-family:'Inter',monospace;font-weight:600}
.rule.amzn .rule-desc code{background:#FFF4DC;color:#9B6800}
.rule.trendyol .rule-desc code{background:#FDEBDA;color:var(--trendyol-d)}

.footer{
  text-align:center;color:var(--muted);font-size:12px;
  margin-top:32px;padding:20px;
  border-top:1px solid var(--cream-d);
  letter-spacing:0.3px;
}
.footer .heart{color:var(--green)}

@media(max-width:640px){
  .header{padding:24px 20px;flex-direction:column;text-align:center}
  .header-title h1{font-size:24px}
  .container{padding:20px 14px}
  .tab-meta .sub{display:none}
  .tab-brand{width:60px;height:30px}
}

// Unify every marketplace's raw shipment status text (English or Arabic) into one of 5 canonical Arabic labels.
function unifyStatus(raw){
  if(!raw) return '';
  const s = String(raw).toLowerCase();
  // Arabic negated-delivery phrasing (e.g. Trendyol's "لم يتم التسليم" = failed delivery attempt) -> Returned
  if((s.includes('لم يتم') || s.includes('لم يصل')) && (s.includes('تسليم') || s.includes('توصيل'))) return 'مرتجع';
  if(s.includes('cancel') || s.includes('الغ') || s.includes('ملغ')) return 'ملغي';
  if(s.includes('return') || s.includes('ارجاع') || s.includes('إرجاع') || s.includes('مرتج')) return 'مرتجع';
  if(s.includes('damag') || s.includes('lost') || s.includes('unfulfillable') || s.includes('تالف') || s.includes('تلف')) return 'تالف';
  if(s.includes('deliver') || s.includes('تسليم') || s.includes('توصيل')) return 'تم التوصيل'; // covers "Delivered", "Shipped - Delivered to Buyer", "تمّ التسليم"
  return 'قيد التنفيذ'; // Pending / Processing / Shipped / Unshipped / PartiallyShipped / Confirmed / تم الشحن / منشأة ...
}

// NOON fulfillment_model -> shipping method. Known codes (e.g. "Fulfilled by Noon (FBN)") are
// reduced to their short code; anything else (e.g. "Supermall") is kept exactly as-is.
function noonChannel(raw){
  if(!raw) return '';
  const v = String(raw).trim();
  const m = v.match(/\(([^)]+)\)/);
  return m ? m[1].trim() : v;
}

// Amazon fulfillment-channel -> shipping method (FBA/FBM).
function amazonChannel(raw){
  if(!raw) return '';
  const v = String(raw).trim();
  const low = v.toLowerCase();
  if(low==='amazon' || low==='afn') return 'FBA';
  if(low==='merchant' || low==='mfn') return 'FBM';
  return v;
}

// route to the Azizia warehouse; Amazon-fulfilled (FBA) orders keep the Amazon FBA warehouse.
function amazonWarehouse(shipMethod){

function setStatus(html,kind='warn'){
  $('status').innerHTML = html ? `<div class="alert alert-${kind}">${html}</div>` : '';
}

function parseDate(s){
  if(!s) return null;
  s = String(s).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  // Trendyol-style DD.MM.YYYY (e.g. "01.08.2026 21:13")
  m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return s.split(' ')[0].split('T')[0];
}

// Build row objects from a 2D array of cells, using the row at headerRowIndex (1-based) as headers.
// Lets a report have leading rows (e.g. a disclaimer banner) before the real header row.
function rowsFromAOA(aoa, headerRowIndex){
  const idx = (headerRowIndex||1) - 1;
  const headerRow = aoa[idx] || [];
  const headers = headerRow.map(h => String(h==null?'':h).trim());
  return aoa.slice(idx+1)
    .filter(arr => arr && arr.some(v => v!==undefined && v!==null && String(v).trim()!==''))
    .map(arr=>{
      const o={};
      headers.forEach((h,i)=>{ if(h) o[h] = arr[i]!==undefined && arr[i]!==null ? arr[i] : ''; });
      return o;
    });
}

function readCSV(text, headerRowIndex){
  const first = text.split('\n').slice(0,5).join('\n');
  const semi = (first.match(/;/g)||[]).length;
  const com = (first.match(/,/g)||[]).length;
  const tab = (first.match(/\t/g)||[]).length;
  let sep = ',';
  if(semi>com && semi>tab) sep=';';
  else if(tab>com && tab>semi) sep='\t';
  const r = Papa.parse(text, {header:false, delimiter:sep, skipEmptyLines:true});
  return rowsFromAOA(r.data, headerRowIndex||1);
}

async function handleFile(file){
  setStatus(`<span class="spinner"></span> &nbsp; Reading and processing: <b>${file.name}</b>`,'warn');
  $('results').classList.add('hidden');
  try{
    let rows;
    if(/\.xlsx?$/i.test(file.name)){
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf,{type:'array',cellDates:false,raw:false});
      let sheetName = wb.SheetNames[0];
      if(currentPlatform==='amazon'){
        const found = wb.SheetNames.find(s=>/amazon/i.test(s));
        if(found) sheetName = found;
      }
      const ws = wb.Sheets[sheetName];
      const aoa = XLSX.utils.sheet_to_json(ws,{header:1, defval:'', raw:false});
      rows = rowsFromAOA(aoa, PLATFORMS[currentPlatform].headerRow || 1);
    } else {
      const text = await file.text();
      rows = readCSV(text, PLATFORMS[currentPlatform].headerRow || 1);
    }
    processed = process(rows);
    render(file.name);
    setStatus(`✅ Successfully processed <b>${file.name}</b> — ready for download`,'ok');
    $('results').scrollIntoView({behavior:'smooth',block:'start'});
  } catch(e){
    console.error(e);
    setStatus(`❌ Failed to process file: ${e.message}`,'err');
  }
}

function process(rows){
  const cfg = PLATFORMS[currentPlatform];
  const F = cfg.fields;
  const cleaned = rows.map(r=>{
    const o={};
    for(const k of Object.keys(r)) o[k.trim()] = String(r[k] ?? '').trim();
    return o;
  });
  const orig_rows = cleaned.length;
  const empty = {};
  empty[F.orderId]=0; empty[F.sku]=0; empty[F.price]=0; empty[F.date]=0;
  let cancelled = 0;
  for(const r of cleaned){
    if(!r[F.orderId]) empty[F.orderId]++;
    if(!r[F.sku]) empty[F.sku]++;
    if(!r[F.price]) empty[F.price]++;
    if(!r[F.date]) empty[F.date]++;
    if(F.status && cfg.cancelStatusValues.includes(r[F.status])) cancelled++;
  }
  const agg = new Map();
  const refsOrder = [];
  const refDate = new Map();
  const refCarrier = new Map();
  function round(n){ return Math.round(n*10000000000)/10000000000 }
  for(const r of cleaned){
    if(F.status && cfg.cancelStatusValues.includes(r[F.status])) continue;
    let ref = r[F.orderId];
    if(cfg.stripSuffix) ref = ref.replace(/-\d+$/, '');
    if(!ref) continue;
    const sku = r[F.sku]; if(!sku) continue;
    if(!refsOrder.includes(ref)){
      refsOrder.push(ref);
      refDate.set(ref, parseDate(r[F.date]));
      if(F.carrier) refCarrier.set(ref, r[F.carrier]||'');
    }
    let rowQty = 1;
    if(F.qty){
      const q = parseFloat(r[F.qty]);
      rowQty = isNaN(q) ? 0 : q;
      if(rowQty<=0) continue;
    }
    const rawPrice = parseFloat(r[F.price]);
    let unitPrice = rawPrice;
    if(!isNaN(rawPrice)){
      if(cfg.priceIsLineTotal && rowQty>0){ unitPrice = rawPrice / rowQty; }
      if(cfg.vatDivisor && cfg.vatDivisor!==1){ unitPrice = unitPrice / cfg.vatDivisor; }
    }
    const key = ref+'|||'+sku;
    let entry = agg.get(key);
    if(!entry){
      const trackingRaw = F.tracking ? (r[F.tracking]||'') : '';
      const channelRaw = F.channel ? (r[F.channel]||'') : '';
      entry = {ref, sku, qty:0, prices:new Set(), firstPrice: isNaN(unitPrice)?r[F.price]:round(unitPrice),
        tracking: trackingRaw,
        shipStatus: unifyStatus(F.status ? r[F.status] : ''),
        shipMethod: cfg.channelFn ? cfg.channelFn(channelRaw) : channelRaw};
      agg.set(key, entry);
    }
    entry.qty += rowQty;
    if(!isNaN(unitPrice)) entry.prices.add(round(unitPrice));
  }
  const lines = [...agg.values()];
  const skuPerOrder = new Map();
  for(const l of lines){ skuPerOrder.set(l.ref, (skuPerOrder.get(l.ref)||0)+1) }
  const multi_sku_orders = [...skuPerOrder.values()].filter(n=>n>1).length;
  const discrepancies = lines.filter(l=>l.prices.size>1)
    .map(l=>({ref:l.ref, sku:l.sku, prices:[...l.prices].sort((a,b)=>a-b)}));
  const outRows = [cfg.headers];
  // Last 6 columns (product, qty, price, tracking ref, shipment status, shipping method) are
  // line-level and always filled; only the leading order-level columns get blanked on continuation lines.
  const blankCount = cfg.headers.length - 6;
  for(const ref of refsOrder){
    const sub = lines.filter(l=>l.ref===ref);
    let first = true;
    for(const l of sub){
      const shipVals = [l.tracking, l.shipStatus, l.shipMethod];
      if(first){
        const warehouse = cfg.warehouseFn ? cfg.warehouseFn(l.shipMethod) : cfg.consts.warehouse;
        const hasCarrierCol = cfg.headers.includes('carrier_id');
        if(hasCarrierCol){
          const carrier = cfg.consts.carrier || refCarrier.get(ref) || '';
          outRows.push([ref, cfg.consts.sales_team, warehouse, carrier,
                        cfg.consts.customer, refDate.get(ref)||'', l.sku, l.qty, l.firstPrice, ...shipVals]);
        } else {
          outRows.push([ref, cfg.consts.sales_team, warehouse,
                        cfg.consts.customer, refDate.get(ref)||'', l.sku, l.qty, l.firstPrice, ...shipVals]);
        }
        first = false;
      } else {
        const blanks = Array(blankCount).fill('');
        outRows.push([...blanks, l.sku, l.qty, l.firstPrice, ...shipVals]);
      }
    }
  }
  return { orig_rows, empty, cancelled,
    unique_orders: refsOrder.length,
    agg_lines: lines.length, multi_sku_orders,
    discrepancies, outRows };
}

function render(filename){
  const p = processed;
  const cfg = PLATFORMS[currentPlatform];
  const F = cfg.fields;
  const isAmzn = currentPlatform==='amazon';
  const stats = [
    {l:'Original Rows', v:p.orig_rows.toLocaleString('en'), c:''},
    {l:'Unique Orders', v:p.unique_orders.toLocaleString('en'), c:isAmzn?'amzn':'ok'},
    {l:'Aggregated Lines', v:p.agg_lines.toLocaleString('en'), c:isAmzn?'amzn':'ok'},
    {l:'Orders with >1 SKU', v:p.multi_sku_orders.toLocaleString('en'), c:''},
  ];
  if(cfg.cancelStatusValues.length) stats.push({l:'Cancelled (excluded)', v:p.cancelled.toLocaleString('en'), c:p.cancelled?'warn':''});
  stats.push(
    {l:`Empty ${F.orderId}`, v:p.empty[F.orderId], c:p.empty[F.orderId]?'err':''},
    {l:`Empty ${F.sku}`, v:p.empty[F.sku], c:p.empty[F.sku]?'err':''},
    {l:`Empty ${F.price}`, v:p.empty[F.price], c:p.empty[F.price]?'err':''},
    {l:`Empty ${F.date}`, v:p.empty[F.date], c:p.empty[F.date]?'err':''},
    {l:'Price Conflicts', v:p.discrepancies.length, c:p.discrepancies.length?'warn':'ok'},
  );
  $('stats').innerHTML = stats.map(s=>
    `<div class="stat ${s.c}"><div class="label">${s.l}</div><div class="val">${s.v}</div></div>`
  ).join('');
  const statusCounts = new Map();
  for(const row of p.outRows.slice(1)){
    const st = row[row.length-2];
    if(st) statusCounts.set(st, (statusCounts.get(st)||0)+1);
  }
  if(statusCounts.size){
    $('stats').innerHTML += [...statusCounts.entries()].map(([st,n])=>
      `<div class="stat"><div class="label">حالة الشحن: ${st}</div><div class="val">${n}</div></div>`
    ).join('');
  }
  let dh = '';
  if(p.discrepancies.length){
    dh = `<div class="alert alert-warn">⚠️ <b>${p.discrepancies.length}</b> order(s) have the same SKU with different prices. The first price was used — please review:</div>
      <table><thead><tr><th>Order Reference</th><th>SKU</th><th>Different Prices</th></tr></thead>
      <tbody>${p.discrepancies.slice(0,50).map(d=>
        `<tr><td>${d.ref}</td><td>${d.sku}</td><td>${d.prices.map(x=>typeof x==='number'?x.toFixed(4):x).join(' · ')}</td></tr>`).join('')}</tbody></table>`;
  } else {
    dh = `<div class="alert alert-ok">✅ Excellent! No price conflicts found in this file</div>`;
  }
  $('disc').innerHTML = dh;
  $('results').classList.remove('hidden');
}

function downloadXlsx(){
  if(!processed) return;
  const cfg = PLATFORMS[currentPlatform];
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(processed.outRows);
  ws['!cols'] = cfg.cols;
  ws['!freeze'] = {xSplit:0, ySplit:1};
  const dateColIdx = cfg.headers.indexOf('Order Date');
  for(let i=2;i<=processed.outRows.length;i++){
    const colLetter = XLSX.utils.encode_col(dateColIdx);
    const addr = `${colLetter}${i}`;
    if(ws[addr] && ws[addr].v){ ws[addr].t = 's' }
  }
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  const ts = new Date().toISOString().slice(0,10);
  const fileTag = {noon:'NOON_FBN', noonfbp:'NOON_FBP', amazon:'Amazon_FBA', trendyol:'Trendyol'}[currentPlatform] || currentPlatform;
  XLSX.writeFile(wb, `Odoo_Import_${fileTag}_${ts}.xlsx`);
}
</script>
</body>
</html>
